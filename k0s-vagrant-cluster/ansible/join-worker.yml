---
# Recovery helper for an already-created worker. The regular k0s-cluster.yml
# remains the normal Vagrant provisioning entrypoint.
- name: Join worker to the existing k0s controller
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Create a fresh worker join token on the controller
      ansible.builtin.command: k0s token create --role=worker --expiry=24h
      delegate_to: master
      register: join_token
      changed_when: false
      no_log: true

    - name: Download k0s installer
      ansible.builtin.get_url:
        url: https://get.k0s.sh
        dest: /tmp/install-k0s.sh
        mode: "0755"

    - name: Install k0s binary
      ansible.builtin.command: /tmp/install-k0s.sh
      args:
        creates: /usr/local/bin/k0s

    - name: Ensure worker token directory exists
      ansible.builtin.file:
        path: /etc/k0s
        state: directory
        mode: "0755"

    - name: Write the worker join token
      ansible.builtin.copy:
        content: "{{ join_token.stdout }}\n"
        dest: /etc/k0s/worker-token
        mode: "0600"
      no_log: true

    - name: Install and start k0s worker
      ansible.builtin.command: k0s install worker --token-file /etc/k0s/worker-token --force --start
      changed_when: false

    - name: Wait for worker service
      ansible.builtin.command: k0s status
      register: k0s_worker_status
      retries: 12
      delay: 5
      until: k0s_worker_status.rc == 0
      changed_when: false
