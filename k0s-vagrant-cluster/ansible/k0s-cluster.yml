---
- name: Configure k0s controller
  hosts: controllers
  become: true
  gather_facts: true
  vars:
    k0s_install_url: https://get.k0s.sh
    k0s_config_path: /etc/k0s/k0s.yaml

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        update_cache: true

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Download k0s installer
      ansible.builtin.get_url:
        url: "{{ k0s_install_url }}"
        dest: /tmp/install-k0s.sh
        mode: "0755"

    - name: Install k0s when it is absent
      ansible.builtin.command: /tmp/install-k0s.sh
      args:
        creates: /usr/local/bin/k0s

    - name: Ensure the k0s configuration directory exists
      ansible.builtin.file:
        path: /etc/k0s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install controller configuration
      ansible.builtin.copy:
        src: k0s.yaml
        dest: "{{ k0s_config_path }}"
        mode: "0644"

    - name: Install and start k0s controller with worker role
      ansible.builtin.command:
        cmd: k0s install controller --enable-worker --no-taints --config {{ k0s_config_path }} --force --start
      changed_when: false

    - name: Wait until the controller is ready
      ansible.builtin.command: k0s kubectl get nodes
      register: controller_nodes
      retries: 24
      delay: 5
      until: controller_nodes.rc == 0
      changed_when: false

    - name: Create a worker join token
      ansible.builtin.command: k0s token create --role=worker --expiry=24h
      register: worker_join_token
      changed_when: false
      no_log: true

    - name: Publish the worker join token to this play
      ansible.builtin.set_fact:
        k0s_worker_token: "{{ worker_join_token.stdout }}"
      no_log: true

    - name: Ensure local kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../env/runtime/kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Export an isolated admin kubeconfig for this project
      ansible.builtin.command: k0s kubeconfig admin
      register: admin_kubeconfig
      changed_when: false
      no_log: true

    - name: Save the isolated admin kubeconfig locally
      ansible.builtin.copy:
        content: "{{ admin_kubeconfig.stdout }}\n"
        dest: "{{ playbook_dir }}/../env/runtime/kube/config"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

- name: Configure k0s worker
  hosts: workers
  become: true
  gather_facts: true
  vars:
    k0s_install_url: https://get.k0s.sh

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        update_cache: true

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Download k0s installer
      ansible.builtin.get_url:
        url: "{{ k0s_install_url }}"
        dest: /tmp/install-k0s.sh
        mode: "0755"

    - name: Install k0s when it is absent
      ansible.builtin.command: /tmp/install-k0s.sh
      args:
        creates: /usr/local/bin/k0s

    - name: Write the worker join token
      ansible.builtin.copy:
        content: "{{ hostvars['master'].k0s_worker_token }}\n"
        dest: /etc/k0s/worker-token
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart k0s worker

    - name: Install and start the k0s worker
      ansible.builtin.command:
        cmd: k0s install worker --token-file /etc/k0s/worker-token --force --start
      changed_when: false

    - name: Wait until worker joins the cluster
      ansible.builtin.command: k0s status
      register: worker_status
      retries: 24
      delay: 5
      until: worker_status.rc == 0
      changed_when: false

  handlers:
    - name: Restart k0s worker
      ansible.builtin.command: k0s install worker --token-file /etc/k0s/worker-token --force --start
      changed_when: false
